document.addEventListener('click',e=>{let r=e.target.closest('[data-role]');if(r){role=r.dataset.role;close();render();$('#app-scroll').scrollTop=0;return}let v=e.target.closest('[data-view]');if(v){view=v.dataset.view;$('#phone').classList.toggle('desk',view==='desktop');$('#workspace').classList.toggle('desktop',view==='desktop');all('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));return}let t=e.target.closest('[data-tab]');if(t){profileTab(t.dataset.tab);return}let o=e.target.closest('[data-open]');if(o){open(o.dataset.open);return}if(e.target.closest('[data-home]')){$('#app-scroll').scrollTop=0}if(e.target.closest('#close-modal')||e.target===$('#overlay'))close();if(e.target.closest('#reset-demo')){attendance=['present','present','not_recorded','present','present','present'];render()}});
