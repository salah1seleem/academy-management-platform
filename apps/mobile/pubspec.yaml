name: academy_mobile
description: Arabic-first Academy native client using the shared business API.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: 11.2.0
  flutter_svg: 2.3.0
  intl: 0.20.3
  file_picker: 13.1.0
  video_player: 2.14.1
  local_auth: 3.0.2
  geolocator: 14.1.1
  passkeys: 2.23.1
  url_launcher: 6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 6.0.0
  video_player_platform_interface: 6.9.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/AcademyArabic-OFL.txt
    - assets/home/
    - assets/avatars/
    - assets/branding/
    - assets/onboarding/
    - assets/demo/
    - assets/demo/nutrition/
    - assets/demo/portraits/
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo.ttf
    - family: AcademyArabic
      fonts:
        - asset: assets/fonts/AcademyArabic-300.ttf
          weight: 300
        - asset: assets/fonts/AcademyArabic-400.ttf
          weight: 400
        - asset: assets/fonts/AcademyArabic-500.ttf
          weight: 500
        - asset: assets/fonts/AcademyArabic-600.ttf
          weight: 600
        - asset: assets/fonts/AcademyArabic-700.ttf
          weight: 700
