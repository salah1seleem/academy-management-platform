name: academy_mobile
description: Arabic-first Academy native client using the shared business API.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: 11.2.0
  flutter_svg: 2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/demo/
    - assets/demo/nutrition/
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo.ttf
