name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test

  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: academy_test
          POSTGRES_USER: academy
          POSTGRES_PASSWORD: academy_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U academy -d academy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ConnectionStrings__Default: Host=127.0.0.1;Port=5432;Database=academy_test;Username=academy;Password=academy_ci_only
      ACADEMY_TEST_CONNECTION_STRING: Host=127.0.0.1;Port=5432;Database=academy_test;Username=academy;Password=academy_ci_only
      Media__PrivateRoot: /tmp/iacademy-backend-media
      DataProtection__KeyPath: /tmp/iacademy-backend-keys
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Install private media inspection tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: dotnet tool restore
      - run: dotnet restore AcademyManagementPlatform.slnx
      - run: dotnet build AcademyManagementPlatform.slnx --no-restore --configuration Release -m:1
      - run: dotnet ef database update --project apps/api/src/Academy.Infrastructure --startup-project apps/api/src/Academy.Api --no-build --configuration Release
      - run: dotnet test AcademyManagementPlatform.slnx --no-build -m:1 --configuration Release --logger "console;verbosity=normal" --logger "trx;LogFilePrefix=backend" --blame-hang-timeout 10m --blame-hang-dump-type none

      - name: Preserve backend test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-results
          path: tests/**/TestResults/*.trx
          retention-days: 7

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:web
      - run: npm run build:web

  e2e:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: academy_e2e
          POSTGRES_USER: academy
          POSTGRES_PASSWORD: academy_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U academy -d academy_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ConnectionStrings__Default: Host=127.0.0.1;Port=5432;Database=academy_e2e;Username=academy;Password=academy_ci_only
      API_INTERNAL_URL: http://127.0.0.1:5080
      ACADEMY_E2E_API_CONFIGURATION: Release
      ACADEMY_E2E_API_NO_BUILD: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install private media inspection tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: dotnet tool restore
      - run: dotnet restore AcademyManagementPlatform.slnx
      - run: dotnet build AcademyManagementPlatform.slnx --no-restore --configuration Release -m:1
      - run: dotnet ef database update --project apps/api/src/Academy.Infrastructure --startup-project apps/api/src/Academy.Api --configuration Release --no-build
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config tests/e2e/playwright.config.ts --output tests/e2e/test-results/regression
      - name: Build football demo web
        run: npm run build:web
        env:
          API_INTERNAL_URL: http://127.0.0.1:5190
      - name: Football demo and coach provisioning E2E
        run: npx playwright test --config tests/e2e/playwright.football.config.ts --output tests/e2e/test-results/football
      - name: Staff passkey browser verification E2E
        run: npx playwright test --config tests/e2e/playwright.passkeys.config.ts --output tests/e2e/test-results/passkeys

      - name: Preserve browser failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-results
          path: tests/e2e/test-results/
          retention-days: 7

  containers:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: iacademy-ci-${{ github.run_id }}
      POSTGRES_DB: iacademy_container_test
      POSTGRES_USER: iacademy_migrator
      POSTGRES_PASSWORD: ci-isolated-only-123
      API_DATABASE_PASSWORD: ci-runtime-isolated-only-456
      WEB_PORT: 3389
    steps:
      - uses: actions/checkout@v4
      - name: Build images and apply migrations on isolated PostgreSQL 17
        run: |
          docker compose build api
          docker compose build web
          docker compose up -d --wait --wait-timeout 240
      - name: Check proxy and production OTP guard
        run: |
          curl --fail http://127.0.0.1:3389/login > /dev/null
          curl --fail -H "X-Forwarded-Proto: https" http://127.0.0.1:3389/api/v1/auth/csrf > /dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -d '{"phoneNumber":"+201000000001"}' http://127.0.0.1:3389/api/v1/mobile/auth/otp/request)" = 501
          docker compose exec -T api sh -c 'test -w /data/media && test -w /data/keys && echo persistent-test > /data/media/compose-test.txt'
          docker compose run --rm migrate
          docker compose restart api web
          docker compose up -d --wait
          docker compose exec -T api sh -c 'test "$(cat /data/media/compose-test.txt)" = persistent-test && test -n "$(find /data/keys -name "key-*.xml" -print -quit)"'
      - name: Backup and restore on a second isolated project
        run: |
          infra/vps/backup.sh /tmp/iacademy-container-backup
          export COMPOSE_PROJECT_NAME=iacademy-restore-${{ github.run_id }}
          export WEB_PORT=3390
          # Stop the first network to release the deliberately fixed trusted proxy subnet.
          COMPOSE_PROJECT_NAME=iacademy-ci-${{ github.run_id }} docker compose down
          infra/vps/restore.sh /tmp/iacademy-container-backup
          docker compose up -d --wait --wait-timeout 240
          curl --fail -H "X-Forwarded-Proto: https" http://127.0.0.1:3390/api/v1/auth/csrf > /dev/null
          docker compose exec -T api sh -c 'test "$(cat /data/media/compose-test.txt)" = persistent-test && test -n "$(find /data/keys -name "key-*.xml" -print -quit)"'
      - name: Container diagnostics
        if: failure()
        run: docker compose ps -a && docker compose logs --tail 150
      - name: Remove only this run's disposable projects
        if: always()
        run: |
          docker compose down -v
          COMPOSE_PROJECT_NAME=iacademy-restore-${{ github.run_id }} docker compose down -v
