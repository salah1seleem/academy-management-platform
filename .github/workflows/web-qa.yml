name: Web QA

on:
  workflow_dispatch:
  push:
    branches: ["codex/qa-web-*"]

permissions:
  contents: read

concurrency:
  group: web-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:web
      - run: npm run build:web
