name: iOS Simulator QA

on:
  workflow_dispatch:
  push:
    branches: ["codex/qa-off-mac", "codex/qa-staging-release", "codex/qa-ios-z-professional"]
    paths:
      - .github/workflows/ios-simulator-qa.yml
      - scripts/qa/ios-simulator-ci.sh
      - scripts/demo/prepare_professional_demo.py
      - scripts/demo/professional_nov05_data.py
      - apps/mobile/**
      - apps/api/**
      - Directory.Packages.props

permissions:
  contents: read

concurrency:
  group: ios-simulator-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  role-homes:
    runs-on: macos-26
    timeout-minutes: 50
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        if: github.ref == 'refs/heads/codex/qa-ios-z-professional'
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true
      - name: Prepare PostgreSQL 17
        run: |
          if ! brew list --versions postgresql@17 >/dev/null; then
            brew install postgresql@17
          fi
          if ! command -v gtimeout >/dev/null; then
            brew install coreutils
          fi
          echo "$(brew --prefix postgresql@17)/bin" >> "$GITHUB_PATH"
      - name: Resolve locked Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get --enforce-lockfile
      - name: Install the synthetic Z Professional fixture dependency
        if: github.ref == 'refs/heads/codex/qa-ios-z-professional'
        run: python -m pip install 'psycopg[binary]==3.2.13'
      - name: Exercise four roles on one iOS simulator
        env:
          ACADEMY_IOS_Z_PROFESSIONAL: ${{ github.ref == 'refs/heads/codex/qa-ios-z-professional' }}
        run: bash scripts/qa/ios-simulator-ci.sh
      - name: Preserve iOS results and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-qa
          path: ${{ runner.temp }}/academy-ios-qa/evidence/
          if-no-files-found: warn
          retention-days: 7
