name: iOS Simulator QA

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Isolated suite on one hosted iOS simulator
        type: choice
        options: [role-homes, enrollment-proof]
        default: role-homes
      checks_only:
        description: Analyze and run focused Flutter/runner regressions without native build
        type: boolean
        default: false
  push:
    branches: ["codex/qa-off-mac", "codex/qa-staging-release"]
    paths:
      - .github/workflows/ios-simulator-qa.yml
      - scripts/qa/ios-simulator-ci.sh
      - apps/mobile/**
      - apps/api/**
      - Directory.Packages.props

permissions:
  contents: read

concurrency:
  group: ios-simulator-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  role-homes:
    runs-on: macos-26
    timeout-minutes: 50
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Verify runner failure propagation
        run: python3 scripts/qa/test_ios_runner_exit.py
      - uses: actions/setup-dotnet@v5
        if: inputs.checks_only != true
        with:
          global-json-file: global.json
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true
      - name: Prepare PostgreSQL 17
        if: inputs.checks_only != true
        run: |
          if ! brew list --versions postgresql@17 >/dev/null; then
            brew install postgresql@17
          fi
          if ! command -v gtimeout >/dev/null; then
            brew install coreutils
          fi
          echo "$(brew --prefix postgresql@17)/bin" >> "$GITHUB_PATH"
      - name: Prepare real file inspection tools
        if: inputs.suite == 'enrollment-proof' && inputs.checks_only != true
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            HOMEBREW_NO_AUTO_UPDATE=1 gtimeout --kill-after=20s 8m brew install ffmpeg
          fi
          python3 - <<'PYMEDIA'
          import subprocess
          subprocess.run(['ffprobe', '-version'], check=True)
          for encoder in ['png', 'libx264', 'aac']:
              result = subprocess.run(['ffmpeg', '-hide_banner', '-h', 'encoder=' + encoder], capture_output=True, text=True, check=True)
              assert 'Encoder ' + encoder + ' [' in result.stdout, encoder
              print('Verified real encoder:', encoder)
          PYMEDIA
      - name: Resolve locked Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get --enforce-lockfile
      - name: Check focused proof test sources
        if: inputs.suite == 'enrollment-proof'
        working-directory: apps/mobile
        run: |
          flutter analyze integration_test/cloud_enrollment_proof_test.dart test/enrollment_payment_source_context_test.dart
          flutter test test/enrollment_payment_source_context_test.dart
      - name: Exercise selected suite on one iOS simulator
        if: inputs.checks_only != true
        env:
          ACADEMY_IOS_SUITE: ${{ inputs.suite || 'role-homes' }}
        run: |
          bash scripts/qa/ios-simulator-ci.sh
          # The macOS Bash EXIT trap must never turn an early abort into green.
          test -s "$RUNNER_TEMP/academy-ios-qa/evidence/suite-completed.txt"
          test "$(cat "$RUNNER_TEMP/academy-ios-qa/evidence/suite-completed.txt")" = "$ACADEMY_IOS_SUITE"
          if [[ "$ACADEMY_IOS_SUITE" == enrollment-proof ]]; then
            test -s "$RUNNER_TEMP/academy-ios-qa/evidence/proof-summary.json"
          fi
      - name: Preserve iOS results and diagnostics
        if: always() && inputs.checks_only != true
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-qa
          path: ${{ runner.temp }}/academy-ios-qa/evidence/
          if-no-files-found: warn
          retention-days: 7
