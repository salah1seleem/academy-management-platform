name: Core Browser QA

on:
  workflow_dispatch:
    inputs:
      group:
        description: Browser journey group
        type: choice
        default: all
        options:
          - all
          - payments-and-import
          - attendance-and-cash
          - operations-and-pricing
          - football-staff-and-receipts
          - staff-verification
          - placement-and-transfers
          - group-creation
          - compensation-and-alternatives
      spec:
        description: Optional spec filename within the selected group
        type: string
        default: ""
  push:
    branches: ["codex/qa-core-release"]

permissions:
  contents: read

jobs:
  select-groups:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: select
        env:
          QA_GROUP: ${{ inputs.group || 'all' }}
          QA_SPEC: ${{ inputs.spec || '' }}
        run: |
          python3 - <<'PYTHON'
          import json, os, re
          from pathlib import Path
          groups = json.loads(Path('.github/qa/core-browser-groups.json').read_text())
          requested = os.environ['QA_GROUP']
          selected = groups if requested == 'all' else [row for row in groups if row['group'] == requested]
          if not selected:
              raise SystemExit(f'Unknown browser journey group: {requested}')
          focus = os.environ.get('QA_SPEC', '').strip()
          if focus:
              if requested == 'all' or not re.fullmatch(r'[a-z][a-z0-9-]*\.spec\.ts', focus):
                  raise SystemExit('Choose one group and a spec filename within it')
              if not Path('tests/e2e/specs', focus).is_file() or not re.search(selected[0]['specs'], '/' + focus):
                  raise SystemExit('The requested spec is not part of the selected group')
              selected[0]['specs'] = '/' + re.escape(focus) + '$'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('matrix=' + json.dumps({'include': selected}, separators=(',', ':')) + '\n')
          PYTHON
  core-browser:
    needs: select-groups
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-groups.outputs.matrix) }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: academy_core_qa
          POSTGRES_USER: academy
          POSTGRES_PASSWORD: academy_ci_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U academy -d academy_core_qa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ConnectionStrings__Default: Host=127.0.0.1;Port=5432;Database=academy_core_qa;Username=academy;Password=academy_ci_only
      ACADEMY_E2E_API_CONFIGURATION: Release
      ACADEMY_E2E_API_NO_BUILD: "true"
      ACADEMY_E2E_PROVIDER_QUARANTINE: ${{ matrix.provider_quarantine }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install private media inspection tools
        if: ${{ matrix.group != 'placement-and-transfers' && matrix.group != 'group-creation' && matrix.group != 'compensation-and-alternatives' }}
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: dotnet tool restore
      - run: dotnet build apps/api/src/Academy.Api --configuration Release -m:1
      - run: dotnet ef database update --project apps/api/src/Academy.Infrastructure --startup-project apps/api/src/Academy.Api --configuration Release --no-build
      - run: npm ci
      - name: Install Chromium with system dependencies
        if: ${{ matrix.group != 'group-creation' && matrix.group != 'compensation-and-alternatives' }}
        run: npx playwright install --with-deps chromium
      - name: Prepare pinned Chromium for scheduling journeys
        if: ${{ matrix.group == 'group-creation' || matrix.group == 'compensation-and-alternatives' }}
        run: |
          npx playwright install chromium
          if ! node - <<'JAVASCRIPT'
          const { chromium } = require('@playwright/test');
          (async () => {
            const browser = await chromium.launch();
            process.stdout.write(`Pinned Chromium launch succeeded: ${browser.version()}\n`);
            await browser.close();
          })().catch(error => { process.stderr.write(`${error.message}\n`); process.exitCode = 1; });
          JAVASCRIPT
          then
            npx playwright install-deps chromium
          fi
      - name: Build Football demo web
        if: ${{ matrix.config != 'regression' }}
        env:
          API_INTERNAL_URL: http://127.0.0.1:5190
        run: npm run build:web
      - name: Run core browser journeys
        env:
          CORE_BROWSER_CONFIG: ${{ matrix.config }}
          CORE_BROWSER_SPECS: ${{ matrix.specs }}
        run: |
          config_path=tests/e2e/playwright.config.ts
          if [[ "$CORE_BROWSER_CONFIG" != regression ]]; then
            config_path="tests/e2e/playwright.$CORE_BROWSER_CONFIG.config.ts"
          fi
          npx playwright test --config "$config_path" --output tests/e2e/test-results/core "$CORE_BROWSER_SPECS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-browser-results-${{ matrix.group }}
          path: tests/e2e/test-results/core/
          if-no-files-found: warn
          retention-days: 7
