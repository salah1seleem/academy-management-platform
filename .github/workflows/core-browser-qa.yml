name: Core Browser QA

on:
  workflow_dispatch:
  push:
    branches: ["codex/qa-core-release"]

permissions:
  contents: read

jobs:
  core-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: payments-and-import
            specs: '/(authentication|core-expense-post-recovery|core-player-import-recovery|enrollment-request-review|slice8d-demo-closure|subscription-discounts|subscriptions-payments|v2-family-renewal-request|v2-renewal-opportunities|v2-staff-family-quote)\.spec\.ts$'
            config: regression
            provider_quarantine: 'false'
          - group: attendance-and-cash
            specs: '/(attendance|v2-attendance-draft|v2-cash-collections|v2-cash-family|v2-cash-receipt-void|v2-cash-registers|v2-admin-cross-branch-cash|v2-cross-branch-cash|v2-pending-cash|v2-collection-funds|v2-receivable-credit|v2-platform|v2-session-lifecycle|reports-exports)\.spec\.ts$'
            config: regression
            provider_quarantine: 'false'
          - group: operations-and-pricing
            specs: '/(owner-review|owner-priority-ux|sports-dashboard|branding-matches|v2-provider-quarantine|v2-family-renewal-quote|v2-plan-publication|v2-season-plans|staff-payroll-ux)\.spec\.ts$'
            config: regression
            provider_quarantine: 'true'
          - group: football-staff-and-receipts
            specs: '/(coach-provisioning|v3-overnight-staff-attendance|v3-opening-correction|v3-payroll-account|v3-payroll-opening|v4-vip-rewards)\.spec\.ts$'
            config: football
          - group: staff-verification
            specs: '/v3-staff-(passkeys|verified-attendance)\.spec\.ts$'
            config: passkeys
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: academy_core_qa
          POSTGRES_USER: academy
          POSTGRES_PASSWORD: academy_ci_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U academy -d academy_core_qa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ConnectionStrings__Default: Host=127.0.0.1;Port=5432;Database=academy_core_qa;Username=academy;Password=academy_ci_only
      ACADEMY_E2E_API_CONFIGURATION: Release
      ACADEMY_E2E_API_NO_BUILD: "true"
      ACADEMY_E2E_PROVIDER_QUARANTINE: ${{ matrix.provider_quarantine }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install private media inspection tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: dotnet tool restore
      - run: dotnet build apps/api/src/Academy.Api --configuration Release -m:1
      - run: dotnet ef database update --project apps/api/src/Academy.Infrastructure --startup-project apps/api/src/Academy.Api --configuration Release --no-build
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build Football demo web
        if: ${{ matrix.config != 'regression' }}
        env:
          API_INTERNAL_URL: http://127.0.0.1:5190
        run: npm run build:web
      - name: Run core browser journeys
        env:
          CORE_BROWSER_CONFIG: ${{ matrix.config }}
          CORE_BROWSER_SPECS: ${{ matrix.specs }}
        run: |
          config_path=tests/e2e/playwright.config.ts
          if [[ "$CORE_BROWSER_CONFIG" != regression ]]; then
            config_path="tests/e2e/playwright.$CORE_BROWSER_CONFIG.config.ts"
          fi
          npx playwright test --config "$config_path" --output tests/e2e/test-results/core "$CORE_BROWSER_SPECS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-browser-results-${{ matrix.group }}
          path: tests/e2e/test-results/core/
          if-no-files-found: warn
          retention-days: 7
